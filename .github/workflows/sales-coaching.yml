name: Sales coaching QA

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: sales-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sales-coaching:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web-app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r requirements-test.txt
      - name: Compile Python and check patch formatting
        run: |
          python -m compileall -q web-app customer_master_sync stockfiller_orders scripts
          git diff --check HEAD^ HEAD
      - name: Run web-app Python test suite
        run: python -m unittest discover -s web-app/tests -p 'test_*.py' 2>&1 | tee backend-tests.log
      - name: Run repository root test suite
        run: python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee root-tests.log
      - name: Run sales-coaching frontend contract tests
        run: python -m unittest web-app.tests.test_sales_coaching_frontend
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated sales-coaching harness
        id: harness
        run: |
          python web-app/tests/sales_coaching_browser_harness.py > sales-coaching-harness.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5065/ >/dev/null && exit 0
            sleep 1
          done
          cat sales-coaching-harness.log
          exit 1
      - name: Desktop browser smoke
        if: always() && steps.harness.outcome == 'success'
        run: node web-app/tests/sales_coaching_browser_smoke.cjs desktop 2>&1 | tee browser-desktop.log
      - name: Mobile browser smoke
        if: always() && steps.harness.outcome == 'success'
        run: node web-app/tests/sales_coaching_browser_smoke.cjs mobile 2>&1 | tee browser-mobile.log
      - name: Guidance and delivery browser regressions
        if: always() && steps.harness.outcome == 'success'
        run: node web-app/tests/guidance_integrity_browser_smoke.cjs 2>&1 | tee browser-guidance.log
      - name: Priority, commitments and seller workflow browser regressions
        if: always() && steps.harness.outcome == 'success'
        run: node web-app/tests/value_priority_browser_smoke.cjs 2>&1 | tee browser-priority.log
      - name: Calendar drag desktop and touch regressions
        if: always() && steps.harness.outcome == 'success'
        env:
          PLANNING_DRAG_HARNESS_URL: http://127.0.0.1:5065
        run: node web-app/tests/planning_drag_browser_smoke.cjs 2>&1 | tee browser-calendar.log
      - name: Start isolated route and attention harness
        id: route_harness
        if: always() && steps.harness.outcome == 'success'
        run: |
          python web-app/tests/route_attention_browser_harness.py > route-attention-harness.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5088/health >/dev/null && exit 0
            sleep 1
          done
          cat route-attention-harness.log
          exit 1
      - name: Route save and grouped attention browser regressions
        if: always() && steps.route_harness.outcome == 'success'
        run: node web-app/tests/route_attention_browser_smoke.cjs 2>&1 | tee browser-route.log
      - name: Removed email integration browser regressions
        if: always() && steps.harness.outcome == 'success'
        run: node web-app/tests/email_removal_browser_smoke.cjs 2>&1 | tee browser-no-email.log
      - name: Preserve verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-removal-browser-verification
          path: |
            artifacts/email-removal
            *-tests.log
            browser-*.log
            sales-coaching-harness.log
            route-attention-harness.log
          retention-days: 7
